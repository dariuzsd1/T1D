name: CI

# Verifies the app lints, type-checks, tests, and builds on every push / PR.
# (Added after Phase 0 — the local dev box had no Node toolchain, so this is
#  the authoritative green-check the audit roadmap promised.)

on:
  push:
  pull_request:

# Cancel superseded runs on the same branch to save free CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # Two commits deep so the Edge Function check below can diff against the
        # previous one. A shallow clone of depth 1 has nothing to compare to.
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Env-independent, so these run before the build needs placeholder secrets.
      - name: Lint (eslint)
        run: npm run lint

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

      # Unit tests for the pure engines (depletion / refill / gs1). No env needed.
      - name: Unit tests (vitest)
        run: npm test

      # Full production build. Placeholder Supabase env vars keep module
      # evaluation from failing on the non-null `process.env.X!` reads.
      # These are throwaway CI values, NOT secrets.
      - name: Build (next build)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-only

      # Vercel auto-deploys the app on every push. NOTHING auto-deploys the
      # notify-refills Edge Function, and CI has no Supabase credentials to do
      # it. So the app can run corrected math while the daily push still
      # computes the old answers, silently -- a notification with the wrong
      # number looks exactly like one with the right number.
      #
      # It has already happened: the 2026-09/10 audit changed
      # _shared/depletion.ts three times and the deployed function kept the
      # pre-audit engine until someone redeployed by hand. A warning annotation,
      # not a failure, because a push that only touches the function is correct
      # until the deploy happens and should not be blocked.
      - name: Remind about the Edge Function deploy
        if: always()
        run: |
          if git diff --name-only HEAD~1 HEAD -- supabase/functions/ | grep -q .; then
            echo "::warning title=Edge Function needs a manual redeploy::This push changed supabase/functions/. Run: npx supabase functions deploy notify-refills --no-verify-jwt --project-ref <REF>. See docs/PUSH_NOTIFICATIONS.md section 3a."
            echo "Changed:"
            git diff --name-only HEAD~1 HEAD -- supabase/functions/
          else
            echo "No Edge Function changes in this push."
          fi
